project_id = "anubis"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "https://anubis.snti.local"
additional_redirect_urls = ["https://anubis.snti.local/auth/confirm", "https://anubis.snti.local/auth/callback?next=/reset-password"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
